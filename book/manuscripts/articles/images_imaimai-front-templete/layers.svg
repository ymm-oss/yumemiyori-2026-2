<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Noto Sans JP', sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="400" fill="#fff"/>

  <rect x="50" y="16" width="330" height="56" rx="6" fill="#f2f2f2" stroke="#333"/>
  <text x="215" y="39" text-anchor="middle" font-weight="bold">route</text>
  <text x="215" y="59" text-anchor="middle" font-family="monospace" font-size="12">src/routes/</text>

  <rect x="50" y="116" width="330" height="56" rx="6" fill="#f2f2f2" stroke="#333"/>
  <text x="215" y="139" text-anchor="middle" font-weight="bold">components</text>
  <text x="215" y="159" text-anchor="middle" font-family="monospace" font-size="11">-components/ ・ shared/components/ ・ shared/ui/</text>

  <rect x="50" y="216" width="330" height="56" rx="6" fill="#d9d9d9" stroke="#333" stroke-width="2"/>
  <text x="215" y="239" text-anchor="middle" font-weight="bold">gateway（認可の境界）</text>
  <text x="215" y="259" text-anchor="middle" font-family="monospace" font-size="12">src/shared/gateway/</text>

  <rect x="50" y="316" width="330" height="56" rx="6" fill="#f2f2f2" stroke="#333"/>
  <text x="215" y="339" text-anchor="middle" font-weight="bold">entities</text>
  <text x="215" y="359" text-anchor="middle" font-family="monospace" font-size="12">src/shared/entities/</text>

  <rect x="424" y="248" width="124" height="124" rx="6" fill="#fff" stroke="#333" stroke-dasharray="5 3"/>
  <text x="486" y="290" text-anchor="middle" font-weight="bold">lib</text>
  <text x="486" y="310" text-anchor="middle" font-size="12">プラットフォームの</text>
  <text x="486" y="326" text-anchor="middle" font-size="12">アダプタ</text>
  <text x="486" y="348" text-anchor="middle" font-family="monospace" font-size="12">src/lib/</text>

  <!-- 隣の層への矢印 -->
  <line x1="215" y1="72" x2="215" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="215" y1="172" x2="215" y2="212" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="215" y1="272" x2="215" y2="312" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- gateway から lib、lib から entities -->
  <line x1="380" y1="258" x2="420" y2="258" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="424" y1="352" x2="384" y2="352" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
